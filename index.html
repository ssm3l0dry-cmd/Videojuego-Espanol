<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ella Trae la Lluvia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ocean animated background -->
  <div class="ocean-bg">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
    <div class="rain-container" id="rainContainer"></div>
  </div>

  <div class="layout">

    <!-- Left sidebar (collapsible) -->
    <aside class="sidebar" id="mainSidebar">
      <nav class="btn-group">
        <button class="btn btn-play"      onclick="playMusic()">&#9654; PLAY MUSIC</button>
        <button class="btn btn-stop"      onclick="stopMusic()">&#9646;&#9646; STOP MUSIC</button>
        <button class="btn btn-inventory" onclick="openInventory()">&#128184; INVENTORY</button>
        <button class="btn btn-saves"     onclick="openSaves()">&#128190; SAVES</button>
        <button class="btn btn-restart"   onclick="restartGame()">&#8635; RESTART</button>
      </nav>
    </aside>

    <!-- Sidebar toggle arrow -->
    <button class="sidebar-toggle" id="mainSidebarToggle" onclick="toggleMainSidebar()" aria-label="Toggle sidebar">
      <svg class="toggle-icon" id="mainToggleIcon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <!-- Main frame -->
    <main class="main-frame" id="mainContent">
      <div class="cover-frame">
        <div class="cover-art">
          <img src="Images/cover.jpeg" alt="Ella Trae la Lluvia — cover art" class="cover-img"/>
          <h1 class="cover-title">Ella Trae<br/>la Lluvia</h1>
        </div>
      </div>

      <!-- Bottom nav -->
      <nav class="bottom-nav">
        <button class="nav-btn" onclick="startPlay()">Play</button>
        <button class="nav-btn" onclick="showCredits()">Credits</button>
        <button class="nav-btn" onclick="showAbout()">About</button>
      </nav>
    </main>

  </div>

  <!-- Modal overlay -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg"/>
  </audio>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="game.js"></script>

  <!-- Page transition overlay -->
  <div id="pageTransition" style="position:fixed;inset:0;background:#040e1a;z-index:200;pointer-events:none;opacity:0;"></div>
</body>
</html>
