<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ella Trae la Lluvia</title>
<style>
/* ════════════════════════════════════════
   SHARED BASE STYLES
════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #040e1a;
  color: #e0eeff;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: hidden;
}
body.story-active {
  overflow-y: auto;
}

/* Ocean background */
.ocean-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: linear-gradient(180deg, #040a18 0%, #06162b 40%, #071d38 70%, #041020 100%);
  overflow: hidden;
}

/* Waves */
.wave {
  position: absolute;
  bottom: 0;
  left: -100%;
  width: 300%;
  border-radius: 43% 57% 56% 44% / 50% 50% 50% 50%;
  animation: waveMove linear infinite;
}
.wave1 { height: 220px; background: rgba(10,40,80,0.55);  animation-duration: 12s; bottom: -60px; }
.wave2 { height: 180px; background: rgba(5,25,60,0.45);   animation-duration: 16s; animation-delay: -4s; bottom: -40px; }
.wave3 { height: 140px; background: rgba(15,50,90,0.35);  animation-duration: 10s; animation-delay: -2s; bottom: -20px; }

@keyframes waveMove {
  0%   { transform: translateX(0)   scaleY(1);    }
  50%  { transform: translateX(25%) scaleY(1.05); }
  100% { transform: translateX(50%) scaleY(1);    }
}

/* Rain */
.rain-container { position: absolute; inset: 0; pointer-events: none; }
.raindrop {
  position: absolute;
  width: 1.5px;
  background: linear-gradient(to bottom, transparent, rgba(130,180,220,0.6));
  border-radius: 2px;
  animation: fall linear infinite;
}
@keyframes fall {
  0%   { transform: translateY(-100px) rotate(10deg); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 0.6; }
  100% { transform: translateY(110vh) rotate(10deg); opacity: 0; }
}

/* Sidebar (shared) */
.sidebar, .story-sidebar {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 220px;
  flex-shrink: 0;
  padding: 40px 24px;
  background: rgba(4,14,26,0.72);
  backdrop-filter: blur(8px);
  border-right: 1px solid rgba(100,160,230,0.15);
  min-height: 100vh;
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1),
              width    0.4s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
}
.story-sidebar { width: 240px; padding: 40px 28px; gap: 22px; }

.sidebar.collapsed,
.story-sidebar.collapsed {
  transform: translateX(-100%);
  width: 0;
  padding-left: 0;
  padding-right: 0;
}

/* Sidebar toggle arrow */
.sidebar-toggle {
  position: fixed;
  left: 220px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 50;
  background: rgba(10,30,60,0.85);
  border: 1px solid rgba(100,160,230,0.35);
  border-left: none;
  border-radius: 0 8px 8px 0;
  color: #7bb8f5;
  width: 28px;
  height: 56px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: left 0.4s cubic-bezier(0.4,0,0.2,1), background 0.15s, color 0.15s;
  padding: 0;
}
.sidebar-toggle:hover { background: rgba(20,60,110,0.95); color: #d6eaff; }
.sidebar-toggle.sidebar-closed { left: 0; }
.toggle-icon { width: 18px; height: 18px; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
.toggle-icon.rotated { transform: rotate(180deg); }

/* Game title */
.game-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: #d6eaff;
  text-shadow: 0 0 18px rgba(80,160,255,0.6);
  line-height: 1.3;
  letter-spacing: 1px;
}

/* Button group */
.btn-group { display: flex; flex-direction: column; gap: 12px; }

/* Sidebar buttons */
.btn {
  display: block;
  width: 100%;
  padding: 13px 16px;
  border: none;
  border-radius: 8px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
  text-transform: uppercase;
}
.btn:hover  { transform: translateY(-2px) scale(1.03); filter: brightness(1.15); }
.btn:active { transform: translateY(1px)  scale(0.97); filter: brightness(0.9);  }
.btn-play      { background: #1a8c4e; color: #e8fff2; box-shadow: 0 4px 16px rgba(26,140,78,0.5); }
.btn-stop      { background: #c0392b; color: #fff0ee; box-shadow: 0 4px 16px rgba(192,57,43,0.5); }
.btn-inventory { background: #8e44ad; color: #f5eeff; box-shadow: 0 4px 16px rgba(142,68,173,0.5); }
.btn-saves     { background: #d97b10; color: #fff8ee; box-shadow: 0 4px 16px rgba(217,123,16,0.5); }
.btn-restart   { background: #2471a3; color: #eaf4ff; box-shadow: 0 4px 16px rgba(36,113,163,0.5); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #0d1f35;
  border: 1.5px solid rgba(100,160,230,0.3);
  border-radius: 14px;
  padding: 36px;
  min-width: 320px;
  max-width: 520px;
  width: 90%;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  color: #cce0ff;
}
.modal-close {
  position: absolute;
  top: 12px; right: 16px;
  background: none;
  border: none;
  color: #7bb8f5;
  font-size: 1.2rem;
  cursor: pointer;
  transition: color 0.15s;
}
.modal-close:hover { color: #fff; }
.modal-content h2  { margin-bottom: 14px; color: #d6eaff; }
.modal-content p   { margin-bottom: 10px; line-height: 1.6; font-size: 0.93rem; }
.modal-content ul  { padding-left: 18px; line-height: 1.9; font-size: 0.9rem; }

/* Save slots */
.save-slots { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.save-slot {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(100,160,230,0.25);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.88rem;
}
.save-slot .slot-actions { display: flex; gap: 8px; }
.save-slot button {
  padding: 5px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: filter 0.15s;
}
.save-slot button:hover { filter: brightness(1.2); }
.btn-save-load { background: #1a8c4e; color: #fff; }
.btn-save-del  { background: #c0392b; color: #fff; }

/* Inventory grid */
.inventory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 12px;
}
.inv-slot {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(100,160,230,0.2);
  border-radius: 8px;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  gap: 4px;
  cursor: default;
  transition: background 0.15s;
}
.inv-slot:hover { background: rgba(100,160,230,0.12); }
.inv-slot span  { font-size: 0.65rem; color: #7bb8f5; letter-spacing: 0.5px; text-transform: uppercase; }
.inv-empty      { opacity: 0.3; }

/* Page transition overlay */
#pageTransition {
  position: fixed;
  inset: 0;
  background: #040e1a;
  z-index: 200;
  pointer-events: none;
}

/* ════════════════════════════════════════
   INDEX PAGE STYLES
════════════════════════════════════════ */
.layout {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  min-height: 100vh;
  padding: 40px 50px 40px 0;
}

.main-frame {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 40px;
}

.cover-frame {
  border: 2.5px solid rgba(255,255,255,0.25);
  border-radius: 18px;
  overflow: hidden;
  width: min(680px, 100%);
  aspect-ratio: 1 / 0.9;
  box-shadow: 0 0 40px rgba(100,170,255,0.15), 0 8px 32px rgba(0,0,0,0.6);
  background: #040e1a;
}
.cover-art {
  width: 100%;
  height: 100%;
  position: relative;
}
.cover-title {
  position: absolute;
  top: 18px; left: 22px;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.6rem;
  font-weight: 900;
  font-style: italic;
  color: #e8f4ff;
  line-height: 1.2;
  letter-spacing: 1px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 30px rgba(60,130,220,0.5);
  pointer-events: none;
  user-select: none;
}
.cover-svg { width: 100%; height: 100%; display: block; }

.bottom-nav { display: flex; gap: 20px; }
.nav-btn {
  background: rgba(10,25,55,0.75);
  border: 2px solid rgba(120,180,255,0.45);
  border-radius: 8px;
  color: #d6eaff;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.05rem;
  font-weight: 700;
  font-style: italic;
  letter-spacing: 1.5px;
  padding: 10px 32px;
  cursor: pointer;
  text-shadow: 0 0 12px rgba(100,170,255,0.7);
  box-shadow: 0 0 14px rgba(60,130,220,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.12s;
  backdrop-filter: blur(4px);
}
.nav-btn:hover {
  background: rgba(20,50,100,0.9);
  border-color: rgba(160,210,255,0.75);
  color: #fff;
  box-shadow: 0 0 22px rgba(80,160,255,0.5);
  transform: translateY(-2px);
}
.nav-btn:active { transform: translateY(1px); filter: brightness(0.9); }

/* ════════════════════════════════════════
   STORY PAGE STYLES
════════════════════════════════════════ */
.story-layout {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: stretch;
  min-height: 100vh;
}

.story-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 80px 80px 60px 60px;
  max-width: 860px;
  margin: 0 auto;
  min-height: 100vh;
}

.chapter-label {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #5a9fd4;
  margin-bottom: 36px;
}

.story-text { display: flex; flex-direction: column; gap: 28px; }

.story-line {
  font-size: 1.12rem;
  line-height: 1.85;
  color: #cfe4ff;
  font-family: Georgia, 'Times New Roman', serif;
}
.story-line.highlight { color: #7bb8f5; font-style: italic; }

.story-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 56px;
}

.story-btn {
  padding: 12px 28px;
  border: none;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  cursor: pointer;
  text-transform: uppercase;
  transition: transform 0.12s, filter 0.15s, box-shadow 0.15s;
}
.story-btn:hover  { transform: translateY(-2px); filter: brightness(1.15); }
.story-btn:active { transform: translateY(1px);  filter: brightness(0.9);  }

.story-btn-back {
  background: rgba(255,255,255,0.08);
  color: #8ab4d4;
  border: 1px solid rgba(100,160,230,0.25);
}
.story-btn-back:hover { background: rgba(255,255,255,0.13); color: #d6eaff; }

.story-btn-next {
  background: #1a8c4e;
  color: #e8fff2;
  box-shadow: 0 4px 18px rgba(26,140,78,0.45);
}

.story-btn-choice {
  background: rgba(20,60,110,0.75);
  color: #c8e0ff;
  border: 1px solid rgba(100,160,230,0.45);
  box-shadow: 0 3px 14px rgba(0,80,180,0.25);
}
.story-btn-choice:hover {
  background: rgba(30,80,150,0.92);
  color: #fff;
  border-color: rgba(140,190,255,0.7);
  box-shadow: 0 5px 20px rgba(0,100,220,0.4);
}

/* Outcome badges */
.outcome-badge {
  width: 100%;
  padding: 16px 22px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 8px;
}
.outcome-badge strong { font-size: 0.82rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.outcome-badge span   { font-size: 0.95rem; line-height: 1.6; font-family: Georgia, serif; }

.outcome-good    { background: rgba(20,90,50,0.55);   border: 1px solid rgba(60,180,100,0.5);   color: #a8f0c0; }
.outcome-neutral { background: rgba(20,50,90,0.55);   border: 1px solid rgba(80,140,220,0.45);  color: #a8ccf0; }
.outcome-bad     { background: rgba(90,20,20,0.55);   border: 1px solid rgba(200,60,60,0.45);   color: #f0a8a8; }

/* Story page needs scrolling */
.story-page body { overflow-y: auto; }

/* Line reveal animation — CSS only, GSAP-free */
.line-hidden {
  opacity: 0;
  transform: translateY(10px);
}
.line-visible {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
</style>
</head>

/* ════════════════════════════════════════
   RAIN GENERATOR
════════════════════════════════════════ */
function generateRain() {
  const container = document.getElementById('rainContainer');
  if (!container) return;
  for (let i = 0; i < 90; i++) {
    const drop = document.createElement('div');
    drop.className = 'raindrop';
    const left     = Math.random() * 100;
    const height   = 12 + Math.random() * 28;
    const duration = 0.6 + Math.random() * 1.2;
    const delay    = Math.random() * 3;
    drop.style.cssText = `left:${left}%;height:${height}px;animation-duration:${duration}s;animation-delay:${delay}s;`;
    container.appendChild(drop);
  }
}
generateRain();

/* ════════════════════════════════════════

════════════════════════════════════════ */
function showModal(title, bodyHTML) {
  document.getElementById('modalContent').innerHTML = `<h2>${title}</h2>${bodyHTML}`;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

/* ════════════════════════════════════════
   INVENTORY
════════════════════════════════════════ */
function openInventory() {
  let items = '';
  state.inventory.forEach(item => {
    items += item
      ? `<div class="inv-slot">${item.icon}<span>${item.name}</span></div>`
      : `<div class="inv-slot inv-empty">＋<span>Vacío</span></div>`;
  });
  showModal('Inventario', `<div class="inventory-grid">${items}</div>`);
}

/* ════════════════════════════════════════
   SAVES
════════════════════════════════════════ */
function openSaves() {
  let slots = '<div class="save-slots">';
  state.saves.forEach(s => {
    slots += `
      <div class="save-slot">
        <span><strong>Ranura ${s.slot}</strong><br/><small>${s.label}</small></span>
        <div class="slot-actions">
          ${s.used
            ? `<button class="btn-save-load" onclick="loadSave(${s.slot})">Cargar</button>
               <button class="btn-save-del"  onclick="deleteSave(${s.slot})">Borrar</button>`
            : `<button class="btn-save-load" onclick="saveGame(${s.slot})">Guardar</button>`}
        </div>
      </div>`;
  });
  slots += '</div>';
  showModal('Partidas Guardadas', slots);
}
function loadSave(slot) {
  closeModal();
  showModal('Cargando…', `<p>Cargando Ranura ${slot}…</p><p style="margin-top:8px;color:#7bb8f5;">¡Bienvenida de vuelta!</p>`);
}
function deleteSave(slot) {
  const s = state.saves.find(x => x.slot === slot);
  if (s) { s.used = false; s.label = 'Ranura vacía'; }
  closeModal(); openSaves();
}
function saveGame(slot) {
  const s = state.saves.find(x => x.slot === slot);
  if (s) { s.used = true; s.label = `Capítulo ${state.chapter} — Guardado`; }
  closeModal(); openSaves();
}

let mainSidebarOpen = true;

function toggleMainSidebar() {
  const sidebar = document.getElementById('mainSidebar');
  const toggle  = document.getElementById('mainSidebarToggle');
  const icon    = document.getElementById('mainToggleIcon');
  mainSidebarOpen = !mainSidebarOpen;
  sidebar.classList.toggle('collapsed', !mainSidebarOpen);
  toggle.classList.toggle('sidebar-closed', !mainSidebarOpen);
  icon.classList.toggle('rotated', !mainSidebarOpen);
  gsap.to(toggle, { left: mainSidebarOpen ? 220 : 0, duration: 0.4, ease: 'power2.inOut' });
}

function restartGame() {
  showModal('Reiniciar', `
    <p>¿Segura que quieres reiniciar el juego desde el principio?</p>
    <div style="display:flex;gap:12px;margin-top:20px;">
      <button class="btn btn-stop"    style="flex:1" onclick="doRestart()">Sí, reiniciar</button>
      <button class="btn btn-restart" style="flex:1" onclick="closeModal()">Cancelar</button>
    </div>`);
}
function doRestart() {
  state.chapter = 1;
  closeModal();
  showIndexPage();
}

function startPlay() {
  gsap.to('#pageTransition', {
    opacity: 1, duration: 0.7, ease: 'power2.in',
    onComplete: () => {
      document.getElementById('indexPage').style.display = 'none';
      document.getElementById('storyPage').style.display = 'block';
      document.body.classList.add('story-active');
      // Small delay so display:block is painted before GSAP reads layout
      setTimeout(() => {
        gsap.to('#pageTransition', {
          opacity: 0, duration: 0.9, ease: 'power2.out',
          onComplete: () => {
            document.getElementById('pageTransition').style.pointerEvents = 'none';
            loadScene('arrival');
          }
        });
      }, 30);
    }
  });
}

function showIndexPage() {
  gsap.to('#pageTransition', {
    opacity: 1, duration: 0.6, ease: 'power2.in',
    onComplete: () => {
      document.getElementById('storyPage').style.display = 'none';
      document.getElementById('indexPage').style.display = 'block';
      document.body.classList.remove('story-active');
      currentSceneId = 'arrival';
      animating      = false;
      gsap.to('#pageTransition', { opacity: 0, duration: 0.7, ease: 'power2.out' });
    }
  });
}

/* ════════════════════════════════════════
   SCENE ENGINE
════════════════════════════════════════ */
let currentSceneId = 'arrival';
let animating      = false;

function loadScene(id) {
  animating      = true;
  currentSceneId = id;

  const scene    = scenes[id];
  const textBox  = document.getElementById('storyText');
  const label    = document.getElementById('chapterLabel');
  const controls = document.getElementById('storyControls');

  // Fully reset containers — clear any GSAP inline styles
  [label, textBox, controls].forEach(el => {
    el.style.cssText = '';
    el.style.opacity = '1';
    el.style.transform = 'none';
  });

  textBox.innerHTML  = '';
  controls.innerHTML = '';
  label.textContent  = scene.chapter;
  label.classList.add('line-hidden');

  scene.lines.forEach(l => {
    const p = document.createElement('p');
    p.className   = 'story-line line-hidden' + (l.highlight ? ' highlight' : '');
    p.textContent = l.text;
    textBox.appendChild(p);
  });

  if (scene.choices) {
    const back = document.createElement('button');
    back.className   = 'story-btn story-btn-back';
    back.textContent = '← Volver';
    back.onclick     = goBack;
    controls.appendChild(back);
    scene.choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className   = 'story-btn story-btn-choice';
      btn.textContent = c.label;
      btn.onclick     = () => gotoScene(c.next);
      controls.appendChild(btn);
    });
  } else if (scene.outcome) {
    const badge = document.createElement('div');
    badge.className = 'outcome-badge outcome-' + scene.outcomeType;
    badge.innerHTML = `<strong>${scene.outcomeTitle}</strong><span>${scene.outcomeText}</span>`;
    controls.appendChild(badge);
    const btn = document.createElement('button');
    btn.className   = 'story-btn story-btn-next';
    btn.textContent = '↩ Explorar otra decisión';
    btn.onclick     = () => gotoScene('arrival');
    controls.appendChild(btn);
  } else {
    const back = document.createElement('button');
    back.className   = 'story-btn story-btn-back';
    back.textContent = '← Volver';
    back.onclick     = goBack;
    controls.appendChild(back);
    const nxt = document.createElement('button');
    nxt.className   = 'story-btn story-btn-next';
    nxt.textContent = 'Continuar →';
    nxt.onclick     = () => gotoScene(scene.next);
    controls.appendChild(nxt);
  }

  controls.classList.add('line-hidden');

  // Reveal: label at 200ms, then each line 1500ms apart, controls 1500ms after last line
  const lines = [...textBox.querySelectorAll('.story-line')];
  const INTERVAL = 1500;

  function reveal(el, delay) {
    setTimeout(() => {
      el.classList.remove('line-hidden');
      el.classList.add('line-visible');
    }, delay);
  }

  reveal(label, 200);
  lines.forEach((el, i) => reveal(el, 200 + (i + 1) * INTERVAL));

  // Controls appear only after the last line's fade-in transition finishes (500ms)
  const lastLineDelay = 200 + lines.length * INTERVAL + 500;
  setTimeout(() => {
    controls.classList.remove('line-hidden');
    controls.classList.add('line-visible');
    animating = false;
  }, lastLineDelay);
}

function gotoScene(id) {
  if (animating) return;
  animating = true;
  const els = ['#chapterLabel','#storyText','#storyControls'].map(s => document.querySelector(s));
  gsap.to(els, {
    opacity: 0, duration: 0.4, ease: 'power2.in', stagger: 0.05,
    onComplete: () => {
      els.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });
      loadScene(id);
    }
  });
}

/* ════════════════════════════════════════
   BOOT
════════════════════════════════════════ */
(function boot() {
  // Fade in the index page on load
  gsap.to('#pageTransition', {
    opacity: 0, duration: 0.9, ease: 'power2.out',
    onComplete: () => {
      document.getElementById('pageTransition').style.pointerEvents = 'none';
    }
  });
})();
</script>
