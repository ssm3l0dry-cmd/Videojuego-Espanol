<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ella Trae la Lluvia — Capítulo 1</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="story.css" />
</head>
<body>

  <!-- Shared ocean background -->
  <div class="ocean-bg">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
    <div class="rain-container" id="rainContainer"></div>
  </div>

  <div class="story-layout" id="storyLayout">

    <!-- Collapsible sidebar -->
    <aside class="story-sidebar" id="storySidebar">
      <h1 class="game-title">Ella Trae<br/>la Lluvia</h1>
      <nav class="btn-group">
        <button class="btn btn-play"      onclick="playMusic()">&#9654; PLAY MUSIC</button>
        <button class="btn btn-stop"      onclick="stopMusic()">&#9646;&#9646; STOP MUSIC</button>
        <button class="btn btn-inventory" onclick="openInventory()">&#128184; INVENTORY</button>
        <button class="btn btn-saves"     onclick="openSaves()">&#128190; SAVES</button>
        <button class="btn btn-restart"   onclick="confirmRestart()">&#8635; RESTART</button>
      </nav>
    </aside>

    <!-- Sidebar toggle arrow -->
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
      <svg class="toggle-icon" id="toggleIcon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <!-- Story main area -->
    <main class="story-main" id="storyMain">

      <!-- Chapter label -->
      <div class="chapter-label" id="chapterLabel">Capítulo I</div>

      <!-- Story text container -->
      <div class="story-text" id="storyText">
        <!-- Lines injected by JS -->
      </div>

      <!-- Controls injected by story.js -->
      <div class="story-controls" id="storyControls"></div>

    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg"/>
  </audio>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="game.js"></script>
  <script src="story.js"></script>
</body>
</html>
